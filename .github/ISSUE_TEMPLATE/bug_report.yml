name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Version Info
      description: OS, Node.js version, Wrangler version, Browser.
      placeholder: |
        - OS: Windows / macOS / Linux
        - Node.js: v20.x
        - Wrangler: v3.x
        - Browser: Chrome 125
    validations:
      required: false
